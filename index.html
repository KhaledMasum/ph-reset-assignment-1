<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Daisy UI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <!-- Tailwind css -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Load JS file -->
    <script src="script.js"></script>
    <!-- Load css -->
    <link rel="stylesheet" href="style.css" />

    <title>SwiftCart E-Commerce</title>
  </head>
  <body>
    <header>
      <div class="mx-auto sm:px-32 navbar bg-base-100 shadow-sm">
        <div class="navbar-start">
          <div class="dropdown">
            <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 6h16M4 12h8m-8 6h16"
                />
              </svg>
            </div>
            <ul
              tabindex="-1"
              class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow"
            >
              <li><a>Home</a></li>
              <li><a>Products</a></li>
              <li><a>About</a></li>
              <li><a>Contact</a></li>
            </ul>
          </div>
          <a class="btn btn-ghost text-xl text-blue-600">SwiftCart</a>
        </div>
        <div class="navbar-center hidden lg:flex">
          <ul class="menu menu-horizontal px-1">
            <li><a>Home</a></li>
            <li><a>Products</a></li>
            <li><a>About</a></li>
            <li><a>Contact</a></li>
          </ul>
        </div>
        <div class="navbar-end">
          <span><i class="fa-solid fa-cart-shopping"></i></span>
        </div>
      </div>
    </header>

    <main class="mx-auto sm:px-20">
      <!-- Banner Section -->
      <section
        class="banner bg-no-repeat bg-black bg-cover bg-center sm:py-16 sm:px-32"
        style="background-image: url(Assets/banner-image.jpg)"
      >
        <div class="grid sm:grid-cols-12 gap-4 items-center">
          <div class="sm:col-span-12 space-y-4 p-4">
            <h1 class="text-4xl text-white font-bold">Online Shopping</h1>
            <p class="text-white">Shop smarter, save bigger every day</p>
            <!-- <button class="btn btn-soft btn-primary mx-auto"></button> -->

            <div class="flex justify-center">
              <button class="btn btn-primary font-bold rounded-3xl text-base">
                Shop Now
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- Why Choose Us -->
      <section id="let's discuss" class="py-6 sm:py-16">
        <h1 class="text-4xl font-extrabold text-center">Why Choose Us</h1>
        <p class="font-light text-center p-4 sm:w-1/2 mx-auto">
          Yes, you can run unit tests and view the results directly within the
          app. The integrated testing features allow for a streamlined.
        </p>

        <div
          class="grid sm:grid-cols-3 gap-4 m-4 sm:m-0"
          id="posts-container"
        ></div>
      </section>
    </main>
  </body>
</html>
